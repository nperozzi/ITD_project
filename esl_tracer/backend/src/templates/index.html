<h1>ESL Control</h1>

<form method="post" action="/set_price">
    <input name="price" placeholder="Enter price">
    <button type="submit">Send</button>
</form>

<h2>Battery Level</h2>
<div id="battery">Loading...</div>

<script>
function fetchBattery() {
    fetch("/battery")
        .then(r => r.json())
        .then(data => {
            document.getElementById("battery").innerText =
                data.battery ?? "No data";
        });
}

setInterval(fetchBattery, 2000);
fetchBattery();
</script>
