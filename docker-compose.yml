services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    ports:
      - "5000:5000"  # Expose Flask port
    volumes:                # We copy the volume for devlopment phase only.
      - ./backend/src:/src
    depends_on:
      - mosquitto

  gateway:
    build: ./gateway
    depends_on:
      - mosquitto

  tag:
    build: ./tag
    depends_on:
      - mosquitto