services:
  # PostgreSQL database for backend persistence.
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=esl
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:        # Check when Postgres is up and running to then allow backend connection.
      test: ["CMD-SHELL", "pg_isready -U postgres -d esl"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MQTT broker used by backend, gateway, and tag simulator.
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./apps/backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/esl
    volumes:
      - ./apps/backend/src:/src
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    ports:
      - "4200:4200"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend

  gateway:
    build: ./apps/gateway
    depends_on:
      - mosquitto
  
  tag:
    build: ./apps/tag
    depends_on:
      - mosquitto
      

volumes:
  postgres_data:
