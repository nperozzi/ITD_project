<!--
    Beginner UI for the ESL demo.
    - Sends a new price to backend via POST /set_price
    - Listens for battery updates via Socket.IO
-->
<h1>ESL Control</h1>

<form id="priceForm">
  <input id="priceInput" name="price" placeholder="Enter price" />
  <button type="submit">Send</button>
</form>

<h2>Battery Level</h2>
<div id="battery">Loading...</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
  // Open a Socket.IO connection back to the same host.
  const socket = io();

  socket.on("connect", () => {
    console.log("Connected to server");
  });

  // Whenever backend emits `battery_update`, refresh text in UI.
  socket.on("battery_update", (data) => {
    console.log("Battery update:", data);
    document.getElementById("battery").innerText = data.battery ?? "No data";
  });

  socket.on("disconnect", () => {
    console.log("Disconnected from server");
  });

  document.getElementById("priceForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const price = document.getElementById("priceInput").value;

    // Send form data as URL-encoded body to Flask route.
    fetch("/set_price", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `price=${encodeURIComponent(price)}`,
    }).then((data) => {
      console.log("Price sent:", price);
      document.getElementById("priceInput").value = "";
    });
  });
</script>
